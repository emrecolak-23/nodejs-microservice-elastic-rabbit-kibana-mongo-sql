apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobber-mysql
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobber-mysql
  template:
    metadata:
      labels:
        app: jobber-mysql
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: jobber-mysql
          image: mysql:8.0
          env:
            - name: MYSQL_USER
              value: jobber
            - name: MYSQL_DATABASE
              value: jobber_auth
            - name: MYSQL_ROOT_PASSWORD
              value: api
            - name: MYSQL_PASSWORD
              value: api
          resources:
            limits:
              memory: '1Gi'
              cpu: '500m'
            requests:
              memory: '128Mi'
              cpu: '100m'
          ports:
            - name: jobber-mysql
              containerPort: 3306
              protocol: TCP
          volumeMounts:
            - name: mysql-local-storage
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  mysql -h127.0.0.1 -u$MYSQL_USER -p$MYSQL_PASSWORD $MYSQL_DATABASE -e"SELECT 1"
            initialDelaySeconds: 120
            periodSeconds: 300
            timeoutSeconds: 60
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  mysqladmin -h127.0.0.1 -u$MYSQL_USER -p$MYSQL_PASSWORD ping
            initialDelaySeconds: 120
            periodSeconds: 300
            timeoutSeconds: 60
      volumes:
        - name: mysql-local-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
