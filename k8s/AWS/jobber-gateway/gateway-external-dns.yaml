apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-external-dns
  namespace: production
  labels:
    app.kubernetes.io/name: gateway-external-dns
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::655916713564:role/eksctl-jobberapp-addon-iamserviceaccount-prod-Role1-UEaFrg6zHOO4
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gateway-external-dns
  namespace: production
  labels:
    app.kubernetes.io/name: gateway-external-dns
rules:
  - apiGroups: ['']
    resources: ['services', 'endpoints', 'pods', 'nodes']
    verbs: ['get', 'watch', 'list']
  - apiGroups: ['extensions', 'networking.k8s.io']
    resources: ['ingresses']
    verbs: ['get', 'watch', 'list']
  - apiGroups: ['']
    resources: ['nodes']
    verbs: ['list', 'watch']
  - apiGroups: ['discovery.k8s.io']
    resources: ['endpointslices']
    verbs: ['get', 'watch', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gateway-external-dns-viewer
  namespace: production
  labels:
    app.kubernetes.io/name: gateway-external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gateway-external-dns
subjects:
  - kind: ServiceAccount
    name: gateway-external-dns
    namespace: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-external-dns
  namespace: production
  labels:
    app.kubernetes.io/name: gateway-external-dns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-external-dns
    spec:
      serviceAccountName: gateway-external-dns
      containers:
        - name: gateway-external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.20.0
          args:
            - --source=service
            - --source=ingress
            - --provider=aws
            - --aws-zone-type=public
            - --registry=txt
            - --txt-owner-id=gateway-external-dns
            - --domain-filter=mjoelak03.online
            - --log-level=debug
          resources:
            limits:
              cpu: '0.5'
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 150Mi
      securityContext:
        fsGroup: 65534
