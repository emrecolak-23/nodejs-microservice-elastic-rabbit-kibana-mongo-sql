services:
  redis:
    container_name: redis_container
    image: redis:8-alpine
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - jobber

  mongodb:
    container_name: mongodb_container
    image: mongo:latest
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - jobber

  mysql:
    container_name: mysql_container
    image: mysql:8.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_USER=jobber
      - MYSQL_DATABASE=jobber_auth
      - MYSQL_ROOT_PASSWORD=api
      - MYSQL_PASSWORD=api
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jobber

  postgres:
    container_name: postgres_container
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=jobber
      - POSTGRES_DB=jobber_reviews
      - POSTGRES_PASSWORD=api
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - jobber

  rabbitmq:
    container_name: rabbitmq_container
    image: rabbitmq:4.0-management-alpine
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=jobber
      - RABBITMQ_DEFAULT_PASS=api
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - jobber

  elasticsearch:
    container_name: elasticsearch_container
    image: elasticsearch:8.17.0
    restart: always
    environment:
      ES_JAVA_OPTS: -Xmx1g -Xms1g
      bootstrap.memory_lock: 'true'
      discovery.type: single-node
      network.host: 0.0.0.0
      transport.host: 127.0.0.1
      http.host: 0.0.0.0
      xpack.security.enabled: 'true'
      xpack.security.authc.api_key.enabled: 'true'
      xpack.monitoring.collection.enabled: 'true'
      xpack.security.enrollment.enabled: 'true'
      xpack.security.authc.token.enabled: 'true'
      ELASTIC_PASSWORD: admin1234
    healthcheck:
      test: ['CMD-SHELL', 'curl -f -u elastic:admin1234 http://localhost:9200/_cluster/health || exit 1'] # ✅ Auth eklendi
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    ports:
      - '9200:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - jobber

  kibana:
    container_name: kibana_container
    image: kibana:8.17.0
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch_container:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=kibana
      - ELASTICSEARCH_SERVICE_ACCOUNT_TOKEN=AAEAAWVsYXN0aWMva2liYW5hL2pvYmJlci1raWJhbmE6dkliU0dUdVhTU2VVVndJNEFLU0tYUQ
      - XPACK_FLEET_AGENTS_ELASTICSEARCH_HOSTS=["http://elasticsearch_container:9200"]
    ports:
      - '5601:5601'
    networks:
      - jobber
    depends_on:
      elasticsearch:
        condition: service_healthy

  apmserver:
    build:
      context: .
      dockerfile: apm-server.Dockerfile
    container_name: apm_server_container
    ports:
      - 8200:8200
    networks:
      - jobber
    command: >
      apm-server -e
        -E apm-server.rum.enabled=true
        -E setup.kibana.host=kibana_container:5601
        -E setup.template.settings.index.number_of_replicas=0
        -E apm-server.kibana.enabled=true
        -E apm-server.kibana.host=kibana_container:5601
        -E apm-server.kibana.protocol=http
        -E strict.perms=false
        -E apm-server.auth.anonymous.enabled=true

  metricbeat:
    container_name: metricbeat_container
    build:
      context: .
      dockerfile: metricbeat.Dockerfile
    user: root
    ports:
      - 5066:5066
    networks:
      - jobber
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro
    command: ['--strict.perms=false', '--system.hostfs=/hostfs']
    depends_on:
      - elasticsearch

  heartbeat:
    container_name: heartbeat_container
    build:
      context: .
      dockerfile: heartbeat.Dockerfile
    user: root
    hostname: heartbeat
    cap_add:
      - NET_RAW
    networks:
      - jobber
    command: ['--strict.perms=false']
    depends_on:
      - elasticsearch
      - kibana

  auth:
    container_name: auth_container
    build:
      context: ./server/auth-service
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - '4002:4002'
    env_file: ./server/auth-service/.env
    environment:
      - ENABLE_APM=1
      - GATEWAY_JWT_TOKEN=942421d626948ab10f6809824d95020d
      - JWT_TOKEN=7cca66193669be5de88f6faa69c4ff57
      - NODE_ENV=development
      - CLIENT_URL=http://localhost:3000
      - API_GATEWAY_URL=http://gateway_container:4000
      - RABBITMQ_ENDPOINT=amqp://jobber:api@rabbitmq_container:5672
      - MYSQL_DB=mysql://jobber:api@mysql_container:3306/jobber_auth
      - ELASTIC_SEARCH_URL=http://elastic:admin1234@elasticsearch_container:9200
      - ELASTIC_APM_SERVER_URL=http://apm_server_container:8200
      - ELASTIC_APM_SECRET_TOKEN=
    depends_on:
      mysql:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - jobber
  gateway:
    container_name: gateway_container
    build:
      context: ./server/gateway-service
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - '4000:4000'
    env_file: ./server/gateway-service/.env
    environment:
      - ENABLE_APM=1
      - GATEWAY_JWT_TOKEN=942421d626948ab10f6809824d95020d
      - JWT_TOKEN=7cca66193669be5de88f6faa69c4ff57
      - NODE_ENV=development
      - SECRET_KEY_ONE=a0dd067a0d146b92cbd01421eb050f1c
      - SECRET_KEY_TWO=16b1c7938bbc482d9793c4f50fff92b1
      - CLIENT_URL=http://localhost:3000
      - AUTH_BASE_URL=http://auth_container:4002
      - USERS_BASE_URL=http://users_container:4003
      - GIG_BASE_URL=http://gig_container:4004
      - MESSAGE_BASE_URL=http://chat_container:4005
      - ORDER_BASE_URL=http://order_container:4006
      - REVIEW_BASE_URL=http://review_container:4007
      - REDIS_HOST=redis://redis_container:6379
      - ELASTIC_SEARCH_URL=http://elastic:admin1234@elasticsearch_container:9200
      - ELASTIC_APM_SERVER_URL=http://apm_server_container:8200
      - ELASTIC_APM_SECRET_TOKEN=
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      auth:
        condition: service_started
      notifications:
        condition: service_started
    networks:
      - jobber
  notifications:
    container_name: notification_container
    build:
      context: ./server/notification-service
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - '4001:4001'
    env_file: ./server/notification-service/.env
    environment:
      - ENABLE_APM=1
      - NODE_ENV=development
      - CLIENT_URL=http://localhost:3000
      - RABBITMQ_ENDPOINT=amqp://jobber:api@rabbitmq_container:5672
      - SENDER_EMAIL=eudora.kemmer@ethereal.email
      - SENDER_EMAIL_PASSWORD=GC5xgQhYrfU16489fU
      - ELASTIC_SEARCH_URL=http://elastic:admin1234@elasticsearch_container:9200
      - ELASTIC_APM_SERVER_URL=http://apm_server_container:8200
      - ELASTIC_APM_SECRET_TOKEN=
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - jobber

  users:
    container_name: users_container
    build:
      context: ./server/users-service
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - '4003:4003'
    env_file: ./server/users-service/.env
    environment:
      - ENABLE_APM=1
      - NODE_ENV=development
      - API_GATEWAY_URL=http://gateway_container:4000
      - GATEWAY_JWT_TOKEN=942421d626948ab10f6809824d95020d
      - JWT_TOKEN=7cca66193669be5de88f6faa69c4ff57
      - RABBITMQ_ENDPOINT=amqp://jobber:api@rabbitmq_container:5672
      - REDIS_HOST=redis://redis_container:6379
      - DATABASE_URL=mongodb://mongodb_container:27017/jobber_users
      - CLOUDINARY_NAME=jobber
      - CLOUDINARY_API_KEY=1234567890
      - CLOUDINARY_API_SECRET=1234567890
      - ELASTIC_SEARCH_URL=http://elastic:admin1234@elasticsearch_container:9200
      - ELASTIC_APM_SERVER_URL=http://apm_server_container:8200
      - ELASTIC_APM_SECRET_TOKEN=
    depends_on:
      mongodb:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - jobber
  gig:
    container_name: gig_container
    build:
      context: ./server/gig-service
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - '4004:4004'
    env_file: ./server/gig-service/.env
    environment:
      - ENABLE_APM=1
      - NODE_ENV=development
      - API_GATEWAY_URL=http://gateway_container:4000
      - GATEWAY_JWT_TOKEN=942421d626948ab10f6809824d95020d
      - JWT_TOKEN=7cca66193669be5de88f6faa69c4ff57
      - RABBITMQ_ENDPOINT=amqp://jobber:api@rabbitmq_container:5672
      - REDIS_HOST=redis://redis_container:6379
      - DATABASE_URL=mongodb://mongodb_container:27017/jobber_gigs
      - CLOUD_NAME=jobber
      - CLOUD_API_KEY=1234567890
      - CLOUD_API_SECRET=1234567890
      - ELASTIC_SEARCH_URL=http://elastic:admin1234@elasticsearch_container:9200
      - ELASTIC_APM_SERVER_URL=http://apm_server_container:8200
      - ELASTIC_APM_SECRET_TOKEN=
    depends_on:
      mongodb:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - jobber

  order:
    container_name: order_container
    build:
      context: ./server/order-service
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - '4006:4006'
    env_file: ./server/order-service/.env
    environment:
      - ENABLE_APM=1
      - NODE_ENV=development
      - CLIENT_URL=http://localhost:3000
      - API_GATEWAY_URL=http://gateway_container:4000
      - GATEWAY_JWT_TOKEN=942421d626948ab10f6809824d95020d
      - JWT_TOKEN=7cca66193669be5de88f6faa69c4ff57
      - RABBITMQ_ENDPOINT=amqp://jobber:api@rabbitmq_container:5672
      - REDIS_HOST=redis://redis_container:6379
      - DATABASE_URL=mongodb://mongodb_container:27017/jobber_order
      - CLOUD_NAME=dqweuyhv0
      - CLOUD_API_KEY=836697868264717
      - CLOUD_API_SECRET=NuYuBYi6hwQ0d7iwqO6L0-eAiNM
      - ELASTIC_SEARCH_URL=http://elastic:admin1234@elasticsearch_container:9200
      - ELASTIC_APM_SERVER_URL=http://apm_server_container:8200
      - ELASTIC_APM_SECRET_TOKEN=
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - jobber

  review:
    container_name: review_container
    build:
      context: ./server/review-service
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - '4007:4007'
    env_file: ./server/review-service/.env
    environment:
      - ENABLE_APM=1
      - NODE_ENV=development
      - API_GATEWAY_URL=http://gateway_container:4000
      - GATEWAY_JWT_TOKEN=942421d626948ab10f6809824d95020d
      - JWT_TOKEN=7cca66193669be5de88f6faa69c4ff57
      - RABBITMQ_ENDPOINT=amqp://jobber:api@rabbitmq_container:5672
      - REDIS_HOST=redis://redis_container:6379
      - DATABASE_HOST=postgres_container
      - DATABASE_USER=jobber
      - DATABASE_PASSWORD=api
      - DATABASE_NAME=jobber_reviews
      - DATABASE_PORT=5432
      - ELASTIC_SEARCH_URL=http://elastic:admin1234@elasticsearch_container:9200
      - ELASTIC_APM_SERVER_URL=http://apm_server_container:8200
      - ELASTIC_APM_SECRET_TOKEN=
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - jobber
  chat:
    container_name: chat_container
    build:
      context: ./server/chat-service
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - '4005:4005'
    env_file: ./server/chat-service/.env
    environment:
      - ENABLE_APM=1
      - NODE_ENV=development
      - API_GATEWAY_URL=http://gateway_container:4000
      - GATEWAY_JWT_TOKEN=942421d626948ab10f6809824d95020d
      - JWT_TOKEN=7cca66193669be5de88f6faa69c4ff57
      - RABBITMQ_ENDPOINT=amqp://jobber:api@rabbitmq_container:5672
      - REDIS_HOST=redis://redis_container:6379
      - DATABASE_URL=mongodb://mongodb_container:27017/jobber_chat
      - ELASTIC_SEARCH_URL=http://elastic:admin1234@elasticsearch_container:9200
      - ELASTIC_APM_SERVER_URL=http://apm_server_container:8200
      - ELASTIC_APM_SECRET_TOKEN=
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - jobber

  jenkins:
    container_name: jenkins_container
    image: jenkins/jenkins:lts
    privileged: true
    user: root
    ports:
      - 8080:8080
      - 50000:50000
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - jobber

  jenkins_agent:
    container_name: jenkins_agent_container
    build:
      context: .
      dockerfile: jenkins-agent.Dockerfile
    privileged: true
    user: root
    expose:
      - 22
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=ssh-rsa  emrecolak@MacBook-Pro
    networks:
      - jobber
networks:
  jobber:
    driver: bridge

volumes:
  redis_data:
  mongo_data:
  mysql_data:
  postgres_data:
  es_data:
  jenkins_data:
